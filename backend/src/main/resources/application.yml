server:
  port: 8080

spring:
  application:
    name: wms-backend

  # 默认使用 H2 文件库，开箱即用，数据落在 backend/data 目录
  datasource:
    url: jdbc:h2:file:./data/wmsdb;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

app:
  jwt:
    # 生产环境务必替换为随机长字符串（不少于 32 字节）
    secret: wms-demo-secret-key-please-change-in-production-0123456789
    expire-minutes: 240
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.example.wms: info
    org.springframework.security: warn
